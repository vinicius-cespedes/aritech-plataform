name: Supplier Enhancements Final

on:
  push:
    branches:
      - agent/bootstrap-platform
    paths:
      - '.supplier-enhancements-final-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-platform
      - name: Patch supplier data model and API
        shell: python
        run: |
          from pathlib import Path
          import re

          schema = Path('packages/database/prisma/schema.prisma')
          s = schema.read_text()
          old = '''  legalName            String       @db.VarChar(200) @map("legal_name")\n  tradeName            String?      @db.VarChar(200) @map("trade_name")\n  taxDocument          String       @db.VarChar(20) @map("tax_document")\n  contactName          String?      @db.VarChar(160) @map("contact_name")\n  contactEmail         String?      @db.VarChar(200) @map("contact_email")\n  contactPhone         String?      @db.VarChar(40) @map("contact_phone")\n'''
          new = '''  legalName               String?      @db.VarChar(200) @map("legal_name")\n  tradeName               String?      @db.VarChar(200) @map("trade_name")\n  taxDocument             String?      @db.VarChar(20) @map("tax_document")\n  industry                String?      @db.VarChar(100)\n  contactName             String?      @db.VarChar(160) @map("contact_name")\n  contactEmail            String?      @db.VarChar(200) @map("contact_email")\n  contactPhoneCountryCode String?      @db.VarChar(8) @map("contact_phone_country_code")\n  contactPhone            String?      @db.VarChar(40) @map("contact_phone")\n'''
          if old not in s:
              raise SystemExit('Supplier schema target not found')
          s = s.replace(old, new, 1)
          s = s.replace('  @@unique([legalEntityId, taxDocument])\n', '  @@index([legalEntityId, taxDocument])\n', 1)
          schema.write_text(s)

          mig = Path('packages/database/prisma/migrations/20260831172000_supplier_registration_flexibility')
          mig.mkdir(parents=True, exist_ok=True)
          (mig/'migration.sql').write_text('''ALTER TABLE "suppliers" ALTER COLUMN "legal_name" DROP NOT NULL;\nALTER TABLE "suppliers" ALTER COLUMN "tax_document" DROP NOT NULL;\nALTER TABLE "suppliers" ADD COLUMN "industry" VARCHAR(100);\nALTER TABLE "suppliers" ADD COLUMN "contact_phone_country_code" VARCHAR(8);\nDROP INDEX IF EXISTS "suppliers_legal_entity_id_tax_document_key";\nCREATE INDEX IF NOT EXISTS "suppliers_legal_entity_id_tax_document_idx" ON "suppliers"("legal_entity_id", "tax_document");\nCREATE UNIQUE INDEX IF NOT EXISTS "suppliers_legal_entity_id_tax_document_not_null_key" ON "suppliers"("legal_entity_id", "tax_document") WHERE "tax_document" IS NOT NULL;\n''')

          domain = Path('apps/api/src/modules/financial/domain')
          domain.mkdir(parents=True, exist_ok=True)
          (domain/'supplier-industries.ts').write_text('''export const SUPPLIER_INDUSTRIES = [\n  'Automação e Integração de Sistemas',\n  'Elétrica',\n  'Instrumentação',\n  'Painéis Elétricos e de Automação',\n  'Mecânica e Caldeiraria',\n  'Tubulação e Conexões',\n  'HVAC e Climatização',\n  'Telecomunicações, Redes e CFTV',\n  'Segurança e Sistemas de Incêndio',\n  'TI, Software e Licenciamento',\n  'Materiais Elétricos',\n  'Instrumentos e Equipamentos Industriais',\n  'EPIs e Segurança do Trabalho',\n  'Ferramentas e Consumíveis',\n  'Usinagem e Fabricação Mecânica',\n  'Serviços de Engenharia',\n  'Construção Civil e Infraestrutura',\n  'Logística e Transportes',\n  'Locação de Equipamentos e Veículos',\n  'Hospedagem, Viagens e Alimentação',\n  'Contabilidade, Jurídico e Consultoria',\n  'Outros',\n] as const;\n''')
          (domain/'brazilian-tax-document.ts').write_text('''export function normalizeTaxDocument(value?: string) {\n  return (value ?? '').replace(/\\D/g, '');\n}\n\nexport function isValidCpf(value: string) {\n  const cpf = normalizeTaxDocument(value);\n  if (cpf.length !== 11 || /^(\\d)\\1{10}$/.test(cpf)) return false;\n  const digit = (size: number) => {\n    let sum = 0;\n    for (let i = 0; i < size; i++) sum += Number(cpf[i]) * (size + 1 - i);\n    const mod = (sum * 10) % 11;\n    return mod === 10 ? 0 : mod;\n  };\n  return digit(9) === Number(cpf[9]) && digit(10) === Number(cpf[10]);\n}\n\nexport function isValidCnpj(value: string) {\n  const cnpj = normalizeTaxDocument(value);\n  if (cnpj.length !== 14 || /^(\\d)\\1{13}$/.test(cnpj)) return false;\n  const calc = (base: string) => {\n    let factor = base.length - 7;\n    let total = 0;\n    for (const char of base) {\n      total += Number(char) * factor--;\n      if (factor < 2) factor = 9;\n    }\n    const result = total % 11;\n    return result < 2 ? 0 : 11 - result;\n  };\n  const d1 = calc(cnpj.slice(0, 12));\n  const d2 = calc(cnpj.slice(0, 12) + d1);\n  return d1 === Number(cnpj[12]) && d2 === Number(cnpj[13]);\n}\n\nexport function isValidBrazilianTaxDocument(value: string) {\n  const digits = normalizeTaxDocument(value);\n  return digits.length === 11 ? isValidCpf(digits) : digits.length === 14 ? isValidCnpj(digits) : false;\n}\n''')

          dto = Path('apps/api/src/modules/financial/presentation/dto/create-supplier.dto.ts')
          d = dto.read_text()
          d = d.replace("import { IsArray, IsBoolean, IsEmail, IsOptional, IsString, IsUUID, MaxLength, ValidateNested } from 'class-validator';", "import { IsArray, IsBoolean, IsEmail, IsIn, IsOptional, IsString, IsUUID, MaxLength, ValidateNested } from 'class-validator';\nimport { SUPPLIER_INDUSTRIES } from '../../domain/supplier-industries';")
          old_dto = '''  @ApiProperty() @IsString() @MaxLength(200) legalName!: string;\n  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(200) tradeName?: string;\n  @ApiProperty() @IsString() @MaxLength(20) taxDocument!: string;\n  @ApiPropertyOptional() @IsOptional() @IsString() contactName?: string;\n  @ApiPropertyOptional() @IsOptional() @IsEmail() contactEmail?: string;\n  @ApiPropertyOptional() @IsOptional() @IsString() contactPhone?: string;\n'''
          new_dto = '''  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(200) legalName?: string;\n  @ApiPropertyOptional() @IsOptional() @IsString() @MaxLength(200) tradeName?: string;\n  @ApiPropertyOptional({ description: 'CPF ou CNPJ. Opcional; quando informado deve ser válido.' }) @IsOptional() @IsString() @MaxLength(20) taxDocument?: string;\n  @ApiPropertyOptional({ enum: SUPPLIER_INDUSTRIES }) @IsOptional() @IsIn(SUPPLIER_INDUSTRIES) industry?: string;\n  @ApiPropertyOptional() @IsOptional() @IsString() contactName?: string;\n  @ApiPropertyOptional() @IsOptional() @IsEmail() contactEmail?: string;\n  @ApiPropertyOptional({ example: '+55' }) @IsOptional() @IsString() @MaxLength(8) contactPhoneCountryCode?: string;\n  @ApiPropertyOptional() @IsOptional() @IsString() contactPhone?: string;\n'''
          if old_dto not in d:
              raise SystemExit('Supplier DTO target not found')
          dto.write_text(d.replace(old_dto, new_dto, 1))

          Path('apps/api/src/modules/financial/application/suppliers.service.ts').write_text('''import { BadRequestException, ConflictException, Injectable } from '@nestjs/common';\nimport { prisma } from '@aritech/database';\nimport { CreateSupplierDto } from '../presentation/dto/create-supplier.dto';\nimport { isValidBrazilianTaxDocument, normalizeTaxDocument } from '../domain/brazilian-tax-document';\n\n@Injectable()\nexport class SuppliersService {\n  list(legalEntityId: string) {\n    return prisma.supplier.findMany({\n      where: { legalEntityId },\n      include: { defaultPaymentTerm: true, bankAccounts: true, pixKeys: true },\n      orderBy: [{ legalName: 'asc' }, { tradeName: 'asc' }],\n    });\n  }\n\n  async create(input: CreateSupplierDto) {\n    const legalName = input.legalName?.trim() || null;\n    const tradeName = input.tradeName?.trim() || null;\n    if (!legalName && !tradeName) throw new BadRequestException('Informe a razão social ou o nome fantasia do fornecedor.');\n\n    const taxDocument = normalizeTaxDocument(input.taxDocument) || null;\n    if (taxDocument && !isValidBrazilianTaxDocument(taxDocument)) throw new BadRequestException('CPF/CNPJ inválido. Verifique os dígitos informados.');\n    if (taxDocument) {\n      const existing = await prisma.supplier.findFirst({ where: { legalEntityId: input.legalEntityId, taxDocument } });\n      if (existing) throw new ConflictException('Já existe um fornecedor cadastrado com este CPF/CNPJ.');\n    }\n\n    return prisma.supplier.create({\n      data: {\n        legalEntityId: input.legalEntityId,\n        legalName, tradeName, taxDocument, industry: input.industry,\n        contactName: input.contactName, contactEmail: input.contactEmail,\n        contactPhoneCountryCode: input.contactPhoneCountryCode?.trim() || null,\n        contactPhone: input.contactPhone?.replace(/\\D/g, '') || null,\n        defaultPaymentTermId: input.defaultPaymentTermId, notes: input.notes,\n        bankAccounts: input.bankAccounts ? { create: input.bankAccounts } : undefined,\n        pixKeys: input.pixKeys ? { create: input.pixKeys } : undefined,\n      },\n      include: { defaultPaymentTerm: true, bankAccounts: true, pixKeys: true },\n    });\n  }\n}\n''')

      - name: Patch supplier UI
        shell: python
        run: |
          from pathlib import Path
          import re
          page = Path('apps/web/app/page.tsx')
          p = page.read_text()
          p = p.replace("type Supplier = { id:string; legalName:string; tradeName?:string; document:string; status:string };", "type Supplier = { id:string; legalName?:string; tradeName?:string; taxDocument?:string; industry?:string; contactPhoneCountryCode?:string; contactPhone?:string; status:string };")
          helpers = r'''\nconst SUPPLIER_INDUSTRIES=['Automação e Integração de Sistemas','Elétrica','Instrumentação','Painéis Elétricos e de Automação','Mecânica e Caldeiraria','Tubulação e Conexões','HVAC e Climatização','Telecomunicações, Redes e CFTV','Segurança e Sistemas de Incêndio','TI, Software e Licenciamento','Materiais Elétricos','Instrumentos e Equipamentos Industriais','EPIs e Segurança do Trabalho','Ferramentas e Consumíveis','Usinagem e Fabricação Mecânica','Serviços de Engenharia','Construção Civil e Infraestrutura','Logística e Transportes','Locação de Equipamentos e Veículos','Hospedagem, Viagens e Alimentação','Contabilidade, Jurídico e Consultoria','Outros'];\nconst COUNTRY_CODES=[['+55','Brasil'],['+1','EUA/Canadá'],['+351','Portugal'],['+44','Reino Unido'],['+34','Espanha'],['+49','Alemanha'],['+39','Itália'],['+86','China'],['+81','Japão']];\nconst onlyDigits=(v:string)=>v.replace(/\\D/g,'');\nfunction formatTaxDocument(v:string){const d=onlyDigits(v).slice(0,14);if(d.length<=11)return d.replace(/(\\d{3})(\\d)/,'$1.$2').replace(/(\\d{3})(\\d)/,'$1.$2').replace(/(\\d{3})(\\d{1,2})$/,'$1-$2');return d.replace(/(\\d{2})(\\d)/,'$1.$2').replace(/(\\d{3})(\\d)/,'$1.$2').replace(/(\\d{3})(\\d)/,'$1/$2').replace(/(\\d{4})(\\d{1,2})$/,'$1-$2')}\nfunction validCpf(v:string){const d=onlyDigits(v);if(d.length!==11||/^(\\d)\\1{10}$/.test(d))return false;const calc=(n:number)=>{let s=0;for(let i=0;i<n;i++)s+=Number(d[i])*(n+1-i);const m=s*10%11;return m===10?0:m};return calc(9)===Number(d[9])&&calc(10)===Number(d[10])}\nfunction validCnpj(v:string){const d=onlyDigits(v);if(d.length!==14||/^(\\d)\\1{13}$/.test(d))return false;const calc=(base:string)=>{let f=base.length-7,t=0;for(const c of base){t+=Number(c)*f--;if(f<2)f=9}const r=t%11;return r<2?0:11-r};const a=calc(d.slice(0,12)),b=calc(d.slice(0,12)+a);return a===Number(d[12])&&b===Number(d[13])}\nfunction validTaxDocument(v:string){const d=onlyDigits(v);return d.length===11?validCpf(d):d.length===14?validCnpj(d):false}\nfunction formatPhone(v:string,country:string){const d=onlyDigits(v).slice(0,country==='+55'?11:15);if(country==='+55'){if(d.length<=2)return d;if(d.length<=6)return d.slice(0,2)+' '+d.slice(2);if(d.length<=10)return d.slice(0,2)+' '+d.slice(2,6)+'-'+d.slice(6);return d.slice(0,2)+' '+d.slice(2,7)+'-'+d.slice(7)}return d.replace(/(\\d{3})(?=\\d)/g,'$1 ').trim()}\nfunction supplierDisplayName(s:Supplier){return s.legalName||s.tradeName||'Fornecedor sem nome'}\n'''
          if 'const SUPPLIER_INDUSTRIES=' not in p:
              p = p.replace("const uid=()=>crypto.randomUUID();\n", "const uid=()=>crypto.randomUUID();\n" + helpers, 1)
          component = r'''function Suppliers({suppliers,legalEntityId,actorId,run,api,refresh}:{suppliers:Supplier[];legalEntityId:string;actorId:string;run:any;api:any;refresh:()=>Promise<void>}){\n  const empty={legalName:'',tradeName:'',taxDocument:'',industry:'',contactName:'',contactEmail:'',contactPhoneCountryCode:'+55',contactPhone:'',notes:''};\n  const [form,setForm]=useState(empty);\n  const digits=onlyDigits(form.taxDocument); const complete=digits.length===11||digits.length===14; const valid=complete&&validTaxDocument(form.taxDocument);\n  async function submit(e:FormEvent){e.preventDefault();await run(async()=>{if(!form.legalName.trim()&&!form.tradeName.trim())throw new Error('Informe a razão social ou o nome fantasia.');if(form.taxDocument&&(!complete||!valid))throw new Error('CPF/CNPJ inválido. Corrija o documento antes de salvar.');await api('/financial/suppliers',{method:'POST',body:JSON.stringify({...form,taxDocument:form.taxDocument||undefined,industry:form.industry||undefined,legalEntityId,status:'ACTIVE',createdBy:actorId})});setForm(empty);await refresh()},'Fornecedor cadastrado.')}\n  return <><Header title="Fornecedores" subtitle="Cadastre beneficiários, contatos e dados-base para contas a pagar."/><div className="sectionGrid"><div className="panel"><h2>Fornecedores cadastrados</h2><div className="tableWrap"><table className="table"><thead><tr><th>Fornecedor</th><th>Ramo</th><th>CPF/CNPJ</th><th>Telefone</th><th>Status</th></tr></thead><tbody>{suppliers.map(s=><tr key={s.id}><td><b>{supplierDisplayName(s)}</b><div className="muted">{s.legalName&&s.tradeName?s.tradeName:'—'}</div></td><td>{s.industry||'—'}</td><td>{s.taxDocument?formatTaxDocument(s.taxDocument):'—'}</td><td>{s.contactPhone?`${s.contactPhoneCountryCode||''} ${formatPhone(s.contactPhone,s.contactPhoneCountryCode||'+55')}`.trim():'—'}</td><td><Status value={s.status}/></td></tr>)}</tbody></table></div></div><form className="panel" onSubmit={submit}><h2>Novo fornecedor</h2><div className="notice">Informe pelo menos a Razão Social ou o Nome Fantasia. CPF/CNPJ é opcional, mas será validado quando preenchido.</div><div className="formGrid"><Input label="Razão social" value={form.legalName} set={v=>setForm({...form,legalName:v})}/><Input label="Nome fantasia" value={form.tradeName} set={v=>setForm({...form,tradeName:v})}/><div className="field"><label>CPF/CNPJ</label><input value={form.taxDocument} inputMode="numeric" placeholder="000.000.000-00 ou 00.000.000/0000-00" onChange={e=>setForm({...form,taxDocument:formatTaxDocument(e.target.value)})}/><div className={`muted ${form.taxDocument&&complete?(valid?'success':'error'):''}`}>{!form.taxDocument?'Opcional':!complete?'Documento incompleto':valid?(digits.length===11?'CPF válido':'CNPJ válido'):'CPF/CNPJ inválido'}</div></div><div className="field"><label>Ramo de atuação</label><select value={form.industry} onChange={e=>setForm({...form,industry:e.target.value})}><option value="">Selecione (opcional)</option>{SUPPLIER_INDUSTRIES.map(x=><option key={x} value={x}>{x}</option>)}</select></div><Input label="Contato" value={form.contactName} set={v=>setForm({...form,contactName:v})}/><Input label="E-mail" value={form.contactEmail} set={v=>setForm({...form,contactEmail:v})}/><div className="field"><label>País</label><select value={form.contactPhoneCountryCode} onChange={e=>setForm({...form,contactPhoneCountryCode:e.target.value,contactPhone:formatPhone(form.contactPhone,e.target.value)})}>{COUNTRY_CODES.map(([code,name])=><option key={code} value={code}>{code} · {name}</option>)}</select></div><div className="field"><label>Telefone</label><input value={form.contactPhone} inputMode="tel" placeholder={form.contactPhoneCountryCode==='+55'?'19 98199-3373':'Telefone'} onChange={e=>setForm({...form,contactPhone:formatPhone(e.target.value,form.contactPhoneCountryCode)})}/><div className="muted">Formato: {form.contactPhoneCountryCode} {form.contactPhone||'...'}</div></div><div className="field full"><label>Observações</label><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/></div></div><div className="actions" style={{marginTop:14}}><button className="btn primary">Salvar fornecedor</button></div></form></div></>\n}\n'''
          p,n = re.subn(r'function Suppliers\(.*?\n\nfunction Payables\(', component+'\nfunction Payables(', p, count=1, flags=re.S)
          if n != 1: raise SystemExit('Supplier component target not found')
          p = p.replace('{s.legalName}</option>', '{supplierDisplayName(s)}</option>')
          page.write_text(p)
      - name: Validate and build
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm --filter @aritech/database validate
          pnpm --filter @aritech/database generate
          pnpm build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma apps/api/src/modules/financial apps/web/app/page.tsx
          git commit -m "feat(financial): enhance supplier registration"
          git push origin HEAD:agent/bootstrap-platform
