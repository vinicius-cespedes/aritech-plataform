name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'agent/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://aritech:aritech@localhost:5432/aritech?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build API
        run: pnpm --filter @aritech/api build

      - name: Build web
        run: pnpm --filter @aritech/web build
