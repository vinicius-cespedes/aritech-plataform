name: Web Type Patch

on:
  push:
    branches:
      - agent/bootstrap-platform
    paths:
      - '.github/workflows/web-type-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-platform
      - name: Patch web type
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web/app/page.tsx')
          s = p.read_text()
          old = "const r=await api<{id:string}>('/financial/bank-reconciliation'"
          new = "const r=await api('/financial/bank-reconciliation'"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new))
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/page.tsx
          git commit -m "fix(web): correct reconciliation API typing"
          git push origin HEAD:agent/bootstrap-platform
