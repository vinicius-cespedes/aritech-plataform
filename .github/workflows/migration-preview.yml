name: Migration Preview

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'packages/database/prisma/schema.prisma'
      - '.github/workflows/migration-preview.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aritech
          POSTGRES_PASSWORD: aritech
          POSTGRES_DB: aritech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aritech -d aritech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aritech:aritech@localhost:5432/aritech?schema=public
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate initial migration
        working-directory: packages/database
        run: pnpm exec prisma migrate dev --name init_financial --create-only

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma/migrations
          git diff --cached --quiet && exit 0
          git commit -m "db: add initial financial migration"
          git push origin HEAD:${{ github.ref_name }}
