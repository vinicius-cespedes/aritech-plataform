name: Allocation Dimensions Patch

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - '.github/workflows/allocation-dimensions-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aritech
          POSTGRES_PASSWORD: aritech
          POSTGRES_DB: aritech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aritech -d aritech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aritech:aritech@localhost:5432/aritech?schema=public
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Patch Prisma schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/database/prisma/schema.prisma')
          s = p.read_text()

          old = '  managementAccounts ManagementAccount[]\n\n  @@index([parentId])'
          new = '  managementAccounts ManagementAccount[]\n  allocations        FinancialClassificationAllocation[]\n\n  @@index([parentId])'
          assert s.count(old) == 2, s.count(old)
          s = s.replace(old, new)

          old = '''  managementAccountId String                        @db.Uuid @map("management_account_id")\n  costCenterId        String?                       @db.Uuid @map("cost_center_id")'''
          new = '''  managementAccountId String                        @db.Uuid @map("management_account_id")\n  economicNature      EconomicNature                @map("economic_nature")\n  dreGroupId          String?                       @db.Uuid @map("dre_group_id")\n  cashFlowGroupId     String?                       @db.Uuid @map("cash_flow_group_id")\n  costCenterId        String?                       @db.Uuid @map("cost_center_id")'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  managementAccount ManagementAccount @relation(fields: [managementAccountId], references: [id], onDelete: Restrict)\n  costCenter        CostCenter?       @relation(fields: [costCenterId], references: [id], onDelete: Restrict)'''
          new = '''  managementAccount ManagementAccount @relation(fields: [managementAccountId], references: [id], onDelete: Restrict)\n  dreGroup          DreGroup?         @relation(fields: [dreGroupId], references: [id], onDelete: Restrict)\n  cashFlowGroup     CashFlowGroup?    @relation(fields: [cashFlowGroupId], references: [id], onDelete: Restrict)\n  costCenter        CostCenter?       @relation(fields: [costCenterId], references: [id], onDelete: Restrict)'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  @@index([managementAccountId])\n  @@index([costCenterId])'''
          new = '''  @@index([managementAccountId])\n  @@index([economicNature])\n  @@index([dreGroupId])\n  @@index([cashFlowGroupId])\n  @@index([costCenterId])'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate schema
        run: pnpm db:validate

      - name: Generate migration
        working-directory: packages/database
        run: pnpm exec prisma migrate dev --name allocation_reporting_dimensions --create-only

      - name: Commit schema and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma/schema.prisma packages/database/prisma/migrations
          git commit -m "refactor(financial): persist reporting dimensions per allocation"
          git push origin HEAD:${{ github.ref_name }}
