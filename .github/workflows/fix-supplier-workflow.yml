name: Fix Supplier Workflow

on:
  push:
    branches:
      - agent/bootstrap-platform
    paths:
      - '.fix-supplier-workflow-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-platform
      - name: Fix install mode
        run: |
          sed -i 's/pnpm install --frozen-lockfile/pnpm install --no-frozen-lockfile/' .github/workflows/supplier-enhancements.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/supplier-enhancements.yml
          git commit -m "fix(ci): support repository without lockfile"
          git push origin HEAD:agent/bootstrap-platform
