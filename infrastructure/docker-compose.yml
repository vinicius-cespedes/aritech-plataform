services:
  postgres:
    image: postgres:17-alpine
    container_name: aritech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aritech
      POSTGRES_PASSWORD: aritech
      POSTGRES_DB: aritech_dev
    ports:
      - "5432:5432"
    volumes:
      - aritech_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aritech -d aritech_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aritech_postgres_data:
